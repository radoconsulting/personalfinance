[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "centen"
version = "0.18.0"
description = "Personal Finance for Claude, for Belgian bank accounts: local MCP server with PSD2 sync (Enable Banking) and CSV/CAMT.053 import."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "mcp>=1.6",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
centen = "centen.cli:main"

[tool.setuptools.packages.find]
include = ["centen*"]

[tool.setuptools.package-data]
centen = ["*.html", "compose.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
