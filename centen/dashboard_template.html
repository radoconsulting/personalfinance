<style>

}

    --text-1: #f0efec; --text-2: #c3c2b7; --muted: #898781;

    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
  --text-1: #f0efec; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }

/* r24: a second row with the tabs of the open pillar */
.subtabs { display: flex; gap: 6px; margin: 0 0 12px; overflow-x: auto; scrollbar-width: none; }
.subtabs::-webkit-scrollbar { display: none; }
.subtabs button { border: 1px solid var(--ring); background: var(--card); border-radius: 99px; padding: 5px 13px; font: inherit;
  font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.subtabs button[aria-selected="true"] { background: var(--text-1); border-color: var(--text-1); color: var(--page); font-weight: 600; }

.band { display: flex; align-items: baseline; gap: 6px 14px; flex-wrap: wrap; padding: 12px 16px; border-radius: 12px; margin-bottom: 14px;

.band .bn { font-weight: 600; font-size: 14px; }

.kv > span { color: var(--text-2); } .kv > b { font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

.spark { height: 46px; }
.filters { display: flex; align-items: center; gap: 10px; margin: 4px 0 18px; flex-wrap: wrap; min-height: 34px; }
.filters .lbl { color: var(--muted); font-size: 12.5px; }
.seg { display: inline-flex; background: var(--card); border: 1px solid var(--ring); border-radius: 9px; padding: 2px; }

.note { color: var(--muted); font-size: 12.5px; }
h2.sec { font-size: 13px; font-weight: 600; color: var(--text-2); text-transform: none; margin: 22px 0 10px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span2 { grid-column: span 2; } .span3 { grid-column: span 3; } .span4 { grid-column: 1 / -1; }
@media (max-width: 960px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3, .g2 { grid-template-columns: 1fr; }
  .span2, .span3 { grid-column: auto; } }
.card { background: var(--card); border: 1px solid var(--ring); border-radius: 12px; padding: 16px 16px 14px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }

.card-s { color: var(--text-2); font-size: 12.5px; margin-top: 2px; }

.toggle:hover { background: var(--wash); }
.tile .lbl { color: var(--text-2); font-size: 12.5px; }

.hero .val { font-size: 48px; line-height: 1.1; }
.hero { display: flex; flex-direction: column; justify-content: center; }
.placeholder { border-style: dashed; background: transparent; }
.placeholder .val { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 8px; font-size: 12.5px; color: var(--text-2); }

.key-line { width: 14px; height: 2px; border-radius: 2px; display: inline-block; }

svg { display: block; overflow: visible; }
svg text { font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
svg text.end { fill: var(--text-2); font-size: 12px; }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--card); border: 1px solid var(--ring);

  display: none; color: var(--text-1); }
.tip .h { color: var(--text-2); margin-bottom: 4px; }
.tip .r { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.tip .r b { font-variant-numeric: tabular-nums; }
.tip .r span { color: var(--text-2); display: inline-flex; align-items: center; gap: 6px; }
.bars { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; align-items: center; gap: 7px 10px; }
.bars .bl { color: var(--text-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bars .bv { font-variant-numeric: tabular-nums; font-size: 12.5px; text-align: right; color: var(--text-1); }
.track { position: relative; height: 14px; }
.track .b { position: absolute; top: 0; height: 14px; border-radius: 0 4px 4px 0; }
.track .b.n { border-radius: 4px 0 0 4px; }
.track .zero { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--axis); }
.bars .row:hover, .bars > .hit:hover { background: var(--wash); }
.segbar { display: flex; gap: 2px; height: 28px; margin: 6px 0 10px; }
.segbar > div { height: 28px; border-radius: 4px; display: flex; align-items: center; padding: 0 8px; color: var(--seg-text);
  font-size: 12px; font-weight: 600; white-space: nowrap; overflow: visible; min-width: 0; cursor: default; }
.segbar > div.dark { color: #0b0b0b; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
table.t td { padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr:last-child td { border-bottom: 0; }
.muted { color: var(--muted); } .sec-text { color: var(--text-2); }
.chip.scope.bv { background: color-mix(in srgb, var(--s6) 22%, transparent); }
.chip.scope.pv { background: color-mix(in srgb, var(--s1) 22%, transparent); }
.sec .chip.scope { font-weight: 500; vertical-align: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 99px;
  border: 1px solid var(--ring); color: var(--text-2); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.alerts { display: flex; flex-direction: column; gap: 8px; }
.alert { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 10px 12px;
  border: 1px solid var(--ring); border-radius: 10px; }
.alert .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #0b0b0b; }
.alert .tt { font-weight: 600; font-size: 13px; }
.alert .dd { color: var(--text-2); font-size: 12.5px; }
.alert .am { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
.flow { display: grid; grid-template-columns: 1fr 22px 1fr 1.2fr auto; gap: 8px; align-items: center; padding: 7px 0;
  border-bottom: 1px solid var(--grid); font-size: 13px; }
.flow:last-child { border-bottom: 0; }
.flow .arr { color: var(--muted); text-align: center; }
.flow .amt { font-variant-numeric: tabular-nums; text-align: right; min-width: 90px; }
.flow .what { color: var(--muted); font-size: 12px; }
.meter { height: 8px; border-radius: 8px; background: var(--track); overflow: hidden; }
.meter > div { height: 8px; border-radius: 8px; }
select.cat { font: inherit; font-size: 12.5px; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--axis); background: var(--card); color: var(--text-1); max-width: 190px; }
.soon { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 960px) { .soon { grid-template-columns: 1fr; } }
.soon > div { border: 1px dashed var(--axis); border-radius: 10px; padding: 12px; }
.soon b { display: block; font-size: 13px; }
.soon span { color: var(--muted); font-size: 12.5px; }
.empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
.tile.uncertain .val::after { content: " ?"; color: var(--warning); }
details.fold { margin-top: 14px; }
details.fold > summary { cursor: pointer; color: var(--text-2); font-size: 13px; padding: 4px 0 10px; list-style: none; }
details.fold > summary::before { content: "▸ "; } details.fold[open] > summary::before { content: "▾ "; }
details.fold[open] > summary { position: absolute; left: -9999px; }  /* open on a wide screen: just the tiles */
@media (max-width: 600px) { details.fold[open] > summary { position: static; } }
details.explain { margin-top: 10px; } details.explain > summary { cursor: pointer; }
details.explain > div { margin-top: 6px; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
@media (max-width: 600px) {
  .wrap { padding: 14px 10px 48px; }
  .g4 { grid-template-columns: 1fr 1fr; gap: 10px; } .span2 { grid-column: 1 / -1; }
  .hero .val { font-size: 34px; } .tile .val { font-size: 19px; } .card { padding: 12px; border-radius: 10px; }
  .card { overflow-x: auto; } table.t { font-size: 12.5px; } table.t td, table.t th { padding: 6px 5px; }
  nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--page); margin: 12px -10px 8px; padding: 0 10px; }
  nav.tabs button { padding: 10px 10px; }
  nav.tabs .long { display: none; } nav.tabs .short { display: inline; }
  .total-hero .val { font-size: 38px; } .pillar .pv { font-size: 25px; }
  .bars { grid-template-columns: minmax(80px, 34%) 1fr auto; }
  .alert { grid-template-columns: 22px 1fr; } .alert .am { grid-column: 2; text-align: left; }
  .flow { grid-template-columns: 1fr 18px 1fr; } .flow .what, .flow .amt { grid-column: span 3; text-align: left; }
  .brand small { display: none; }
  .centen-nav ~ .viz-root .brand { display: none; }
  header.top { flex-wrap: nowrap; align-items: flex-start; }  /* on the server the nav bar above already says centen */
  .iconbtn .lbl-long { display: none; }
  nav.tabs { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
             mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent); scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
}
.ctrl { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px 18px; }
.ctrl label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--text-2); }
.ctrl label b { color: var(--text-1); font-variant-numeric: tabular-nums; }
.ctrl input[type=range] { width: 100%; accent-color: var(--s1); }
.ctrl .chk { flex-direction: row; align-items: center; gap: 8px; }
tr.off td { color: var(--muted); }
  .checklist { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: var(--text-2, inherit); }
</style>

<script>
"use strict";
const D = JSON.parse(document.getElementById("centen-data").textContent);

// ---------- formatting ----------
const fmt0 = new Intl.NumberFormat("nl-BE", {style: "currency", currency: "EUR", maximumFractionDigits: 0});
const fmt2 = new Intl.NumberFormat("nl-BE", {style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2});
const num1 = new Intl.NumberFormat("nl-BE", {maximumFractionDigits: 1});
const eur = v => v == null || isNaN(v) ? "—" : (Math.abs(v) < 100 && v % 1 !== 0 ? fmt2 : fmt0).format(v);
const eurS = v => v == null ? "—" : (v > 0 ? "+" : "") + eur(v);
const pct = v => v == null ? "—" : num1.format(v * 100) + "%";
function axisEur(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toLocaleString("nl-BE", {maximumFractionDigits: 1}) + " mln";
  if (a >= 10000) return Math.round(v / 1000).toLocaleString("nl-BE") + "k";
  return Math.round(v).toLocaleString("nl-BE");
}
const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const mLabel = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(2, 4);
const dLabel = d => d ? `${+d.slice(8, 10)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "—";

const CAT = {
  "Salary": "Loon", "Child benefit (Groeipakket)": "Groeipakket", "Healthcare refunds": "Terugbetaling ziekenfonds",

  "Accounting & advisory": "Boekhouding & advies", "Own accounts": "Eigen rekeningen", "Household transfers": "Gezin",

  "Loans & mortgage": "Leningen", "Energy": "Energie", "Water": "Water", "Telecom & internet": "Telecom & internet",
  "Home & DIY": "Wonen & doe-het-zelf", "Groceries": "Boodschappen", "Restaurants & takeaway": "Restaurant & afhaal",
  "Insurance": "Verzekeringen", "Health insurance (mutualiteit)": "Ziekenfonds", "Healthcare": "Gezondheid",
  "Public transport & taxi": "Openbaar vervoer & taxi", "Fuel": "Brandstof", "EV charging": "Laden",
  "Parking & tolls": "Parking & tol", "Car & maintenance": "Auto", "Taxes & social security": "Belastingen & sociale bijdragen",
  "Childcare & school": "Kinderopvang & school", "Subscriptions & streaming": "Abonnementen", "News & magazines": "Kranten",
  "Shopping": "Shopping", "Clothing & shoes": "Kleding & schoenen", "Electronics": "Elektronica",
  "Drugstore & personal care": "Drogisterij & verzorging", "Pets": "Huisdieren", "Leisure & sport": "Vrije tijd & sport",
  "Travel & holidays": "Reizen", "Gifts & donations": "Giften", "Education": "Opleiding", "Post & shipping": "Post",
  "Bank fees": "Bankkosten", "Cash withdrawal": "Cash", "Online payments": "Online betalingen", "Other expenses": "Overige uitgaven",
};
const cat = c => CAT[c] || c;
const CADENCE = {"weekly": "wekelijks", "every 2 weeks": "tweewekelijks", "monthly": "maandelijks", "every 2 months": "tweemaandelijks",
  "quarterly": "per kwartaal", "every 6 months": "halfjaarlijks", "yearly": "jaarlijks"};
const nlName = s => (s || "").replace(/^Joint \((.*)\)$/, "Gedeeld ($1)").replace(/ - other account \(not linked\)$/, " – andere rekening (niet gekoppeld)")
  .replace(/^Own account /, "Eigen rekening ").replace(/ \(via Warrants \((.*)\)\)$/, " (warranten via $1)").replace(/^Warrants \((.*)\)$/, "Warranten ($1)");

// ---------- DOM helpers (all data goes in via textContent) ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const tip = document.getElementById("tip");
function showTip(evt, head, rows) {
  tip.textContent = "";
  if (head) tip.append(el("div", {class: "h"}, head));
  for (const r of rows) tip.append(el("div", {class: "r"},
    el("span", {}, r.color ? el("i", {class: "key-line", style: `background:${r.color}`}) : null, r.name), el("b", {}, r.value)));
  tip.style.display = "block";
  const rect = tip.getBoundingClientRect();
  let x = (evt.clientX ?? 0) + 14, y = (evt.clientY ?? 0) + 14;
  if (x + rect.width > innerWidth - 8) x = (evt.clientX ?? 0) - rect.width - 14;
  if (y + rect.height > innerHeight - 8) y = innerHeight - rect.height - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function table(cols, rows, empty) {

const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { hi = lo + 1; }
  const raw = (hi - lo) / (n - 1), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

function lineChart(host, {labels, series, height = 250, area = false, fmtX = mLabel, refs = [], fmtY = null, zero = true}) {
  host.textContent = "";
  if (!labels.length) { host.append(el("div", {class: "empty"}, "Geen gegevens in deze periode.")); return; }
  if (series.length >= 2) host.append(el("div", {class: "legend"},
    series.map(s => el("span", {}, el("i", {class: "key-line", style: `background:${s.color}`}), s.name))));
  const W = Math.max(320, host.clientWidth || 600), H = height;
  const directLabels = series.length <= 4;
  const m = {l: W < 480 ? 44 : 52, r: directLabels ? (W < 480 ? 62 : 92) : 16, t: 10, b: 26};
  const vals = series.flatMap(s => s.values).filter(v => v != null).concat(refs.map(r => r.value));
  const ticks = zero ? niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 5) : niceTicks(Math.min(...vals), Math.max(...vals), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const n = labels.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + (n <= 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + (hi - v) / (hi - lo) * ih;
  const svg = sv("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": series.map(s => s.name).join(", ")});
  for (const t of ticks) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1}));
    svg.append(sv("text", {x: m.l - 8, y: y(t) + 4, "text-anchor": "end"}, (fmtY || axisEur)(t)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 64))));
  // x labels: every k-th, plus the last one for short series; a label too close to its neighbour is dropped (r22)
  const xAt = labels.map((_, i) => i).filter(i => i % every === 0);
  if (n < 14 && xAt[xAt.length - 1] !== n - 1) {
    if (xAt.length && x(n - 1) - x(xAt[xAt.length - 1]) < 56) xAt.pop();
    xAt.push(n - 1);
  }
  for (const i of xAt) svg.append(sv("text", {x: x(i), y: H - 6, "text-anchor": i === n - 1 && n > 1 ? "end" : "middle"}, fmtX(labels[i])));
  for (const r of refs) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: y(r.value), y2: y(r.value), stroke: r.color || "var(--warning)", "stroke-width": 1.5, "stroke-dasharray": "5 4"}));
    svg.append(sv("text", {x: m.l + 6, y: y(r.value) - 5}, r.label));
  }
  const ends = [];
  for (const s of series) {
    let d = "";
    s.values.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });
    if (area) {
      const firstI = s.values.findIndex(v => v != null);
      svg.append(sv("path", {d: d + `L${x(n - 1)} ${y(0)}L${x(firstI)} ${y(0)}Z`, fill: s.color, "fill-opacity": 0.1, stroke: "none"}));
    }
    svg.append(sv("path", {d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    const li = s.values.length - 1;
    if (s.values[li] != null) {
      svg.append(sv("circle", {cx: x(li), cy: y(s.values[li]), r: 4, fill: s.color, stroke: "var(--card)", "stroke-width": 2}));
      ends.push({y: y(s.values[li]), name: s.name, v: s.values[li]});
    }
  }
  if (directLabels && ends.length) {
    ends.sort((a, b) => a.y - b.y);
    const clash = ends.some((e, i) => i && e.y - ends[i - 1].y < 15);
    if (!clash) for (const e of ends) svg.append(sv("text", {class: "end", x: W - m.r + 10, y: e.y + 4}, (fmtY || axisEur)(e.v)));
  }
  const cross = sv("line", {y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden"});
  svg.append(cross);
  const marks = series.map(s => { const c = sv("circle", {r: 4, fill: s.color, stroke: "var(--card)", "stroke-width": 2, visibility: "hidden"}); svg.append(c); return c; });
  const hit = sv("rect", {x: m.l - 8, y: m.t, width: iw + 16, height: ih, fill: "transparent", tabindex: 0, "aria-label": "Grafiek: gebruik pijltjestoetsen"});
  let cur = -1;
  const show = (i, evt) => {
    cur = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute("x1", x(cur)); cross.setAttribute("x2", x(cur)); cross.setAttribute("visibility", "visible");
    series.forEach((s, k) => { const v = s.values[cur]; if (v == null) { marks[k].setAttribute("visibility", "hidden"); return; }
      marks[k].setAttribute("cx", x(cur)); marks[k].setAttribute("cy", y(v)); marks[k].setAttribute("visibility", "visible"); });
    const r = svg.getBoundingClientRect();
    const e = evt || {clientX: r.left + x(cur), clientY: r.top + m.t + 10};
    showTip(e, fmtX(labels[cur], true), series.map(s => ({name: s.name, value: (fmtY || eur)(s.values[cur]), color: s.color})));
  };
  hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(); const px = e.clientX - r.left;
    show(Math.round((px - m.l) / (iw / Math.max(1, n - 1))), e); });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); marks.forEach(c => c.setAttribute("visibility", "hidden")); hideTip(); });
  hit.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
  hit.addEventListener("focus", () => show(n - 1));
  hit.addEventListener("blur", () => { hideTip(); cross.setAttribute("visibility", "hidden"); });
  svg.append(hit);
  host.append(svg);
}

function hbars(host, items, {color = "var(--s1)", signed = false, max = 12, label = x => x.label, value = x => x.value, extra, fmt = null} = {}) {
  host.textContent = "";
  let list = items.filter(i => Math.abs(value(i)) >= 0.5);
  if (!list.length) { host.append(el("div", {class: "empty"}, "Niets in deze periode.")); return; }
  if (list.length > max) {
    const rest = list.slice(max - 1);
    list = list.slice(0, max - 1).concat([{__other: true, label: `Overige (${rest.length})`, value: rest.reduce((a, b) => a + value(b), 0)}]);
  }
  const vals = list.map(i => i.__other ? i.value : value(i));
  const maxAbs = Math.max(...vals.map(Math.abs)) || 1;
  const hasNeg = signed && vals.some(v => v < 0);
  const box = el("div", {class: "bars"});
  list.forEach((it, idx) => {
    const v = vals[idx], name = it.__other ? it.label : label(it);
    const track = el("div", {class: "track"});
    const zeroAt = hasNeg ? 50 : 0, span = hasNeg ? 50 : 100;
    const w = Math.max(0.6, Math.abs(v) / maxAbs * span);
    const b = el("div", {class: "b" + (v < 0 ? " n" : ""), style: `background:${v < 0 ? "var(--neg)" : color};width:${w}%;` +
      (v < 0 ? `right:${100 - zeroAt}%` : `left:${zeroAt}%`)});
    track.append(b);
    if (hasNeg) track.append(el("div", {class: "zero", style: `left:${zeroAt}%`}));
    const row = [el("div", {class: "bl", title: name}, name), track, el("div", {class: "bv"}, fmt ? fmt(v, it) : signed ? eurS(v) : eur(v))];
    const enter = e => showTip(e, name, (fmt ? [] : [{name: "Bedrag", value: eur(v)}]).concat(extra && !it.__other ? extra(it) : []));
    row.forEach(r => { r.addEventListener("pointermove", enter); r.addEventListener("pointerleave", hideTip); box.append(r); });
  });
  host.append(box);
}

function segmented(host, parts) {
  host.textContent = "";
  const total = parts.reduce((a, p) => a + Math.max(0, p.value), 0) || 1;
  const bar = el("div", {class: "segbar", role: "img", "aria-label": parts.map(p => `${p.label} ${eur(p.value)}`).join(", ")});
  for (const p of parts) {
    if (p.value <= 0) continue;
    const share = p.value / total;
    const blk = el("div", {class: p.dark ? "dark" : "", style: `flex:${share} 1 0;background:${p.color}`, tabindex: 0});
    const txt = `${Math.round(share * 100)}%`;
    if (host.clientWidth * share > txt.length * 8 + 16) blk.textContent = txt;
    const enter = e => showTip(e, p.label, [{name: "Bedrag", value: eur(p.value)}, {name: "Aandeel", value: pct(share)}]);
    blk.addEventListener("pointermove", enter); blk.addEventListener("pointerleave", hideTip);
    blk.addEventListener("focus", () => { const r = blk.getBoundingClientRect(); enter({clientX: r.left + 10, clientY: r.bottom}); });
    blk.addEventListener("blur", hideTip);
    bar.append(blk);
  }
  host.append(bar, el("div", {class: "legend"}, parts.filter(p => p.value > 0).map(p =>
    el("span", {}, el("i", {class: "key-rect", style: `background:${p.color}`}), `${p.label} · ${eur(p.value)}`))));
  for (const b of bar.children) b.style.color = labelOn(getComputedStyle(b).backgroundColor);
}
// Black or white text, whichever contrasts more with the segment's colour (r22: dark text on dark green was unreadable).
function labelOn(rgb) {
  const m = (rgb || "").match(/\d+(\.\d+)?/g);
  if (!m || m.length < 3) return "";
  const lin = c => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); };
  const L = 0.2126 * lin(+m[0]) + 0.7152 * lin(+m[1]) + 0.0722 * lin(+m[2]);
  return L > 0.179 ? "#0b0b0b" : "#ffffff";
}

function renderTabs() {

function copyText(txt, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = "Gekopieerd ✓"; setTimeout(() => { btn.textContent = o; }, 1400); } };
  const fallback = () => {
    const ta = el("textarea", {style: "position:fixed;left:-9999px;top:0"}); ta.value = txt; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { prompt("Kopieer:", txt); } ta.remove();
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
}

const DIM_NL = {class: "Soort", region: "Regio", currency: "Noteringsmunt", account: "Rekening"};
function riskCards() {
  const R = X("risk");
  if (!R) return [];
  const out = [], TW = R.time_weighted || {}, T = TW.total || {}, B = TW.benchmark || {};
  const pc = x => x == null ? "—" : pctS(x);
  // 1. time-weighted return
  const rc = card("Rendement en risico", T.months && T.months.length ? `Tijdgewogen (TWR) · ${T.months.length} maanden sinds ${mLabel(T.months[0])}` : "Tijdgewogen rendement", {cls: "span2",
    table: () => table([{label: "Rekening", get: r => r.account}, {label: "Sinds", get: r => mLabel(r.from)}, {label: "Totaal", num: true, get: r => pc(r.total)},
      {label: "Per jaar", num: true, get: r => pc(r.annualised)}, {label: "Volatiliteit", num: true, get: r => r.volatility == null ? "—" : pct(r.volatility)},
      {label: "Max. daling", num: true, get: r => pc(r.max_drawdown)}, {label: "Slechtste maand", num: true, get: r => pc(r.worst_month)}], TW.accounts || [])});
  if (TW.error || !(T.months && T.months.length)) {
    rc.body.append(el("div", {class: "muted"}, TW.error || TW.note || "Nog geen gegevens."));
  } else {
    const yr = T.annualised != null;
    rc.body.append(el("div", {class: "grid g4", style: "margin-bottom:12px"},
      tile(yr ? "Per jaar" : "Totaal", pc(yr ? T.annualised : T.total), B.months && B.months.length ? `${B.name.split(" (")[0]}: ${pc(yr ? B.annualised : B.total)}` : "zonder benchmark"),
      tile("Volatiliteit", T.volatility == null ? "—" : pct(T.volatility), B.volatility != null ? `benchmark ${pct(B.volatility)} · per jaar` : "per jaar"),
      tile("Grootste daling", pc(T.max_drawdown), B.max_drawdown != null ? `benchmark ${pc(B.max_drawdown)}` : "van top tot dal"),
      tile("Slechtste maand", pc(T.worst_month), `beste ${pc(T.best_month)} · ${pct(T.positive_months || 0)} maanden positief`)));
    const host = el("div");
    rc.body.append(host);
    const L = TW.line || [];
    requestAnimationFrame(() => lineChart(host, {labels: L.map(x => x.month), series: [
      {name: "Jouw beleggingen", values: L.map(x => x.own), color: SERIES[0]},
      ...(L.some(x => x.benchmark != null) && B.months.length ? [{name: B.name.split(" (")[0], values: L.map(x => x.benchmark), color: "var(--s7)"}] : [])],
      fmtY: v => v == null ? "—" : num1.format(v), zero: false}));
    const facts = [`Start = 100. Stortingen en opnames tellen niet als rendement.`];
    if (TW.correlation_with_benchmark != null) facts.push(`correlatie met de benchmark ${TW.correlation_with_benchmark.toFixed(2).replace(".", ",")}` + (TW.beta != null ? ` · bèta ${TW.beta.toFixed(2).replace(".", ",")}` : ""));
    if ((TW.left_out || []).length) facts.push(`niet meegeteld (geen koerswaarden): ${TW.left_out.join(", ")}`);
    if ((T.skipped || []).length) facts.push(`${T.skipped.length} maand${T.skipped.length > 1 ? "en" : ""} overgeslagen (sprong in de gegevens)`);
    rc.body.append(el("div", {class: "note", style: "margin-top:6px"}, facts.join(" · ")));
  }
  out.push(rc.root);
  // 2. diversification score
  const DV = R.diversification;
  if (DV) {
    const dc = card("Spreidingsscore", `${DV.label} · na doorkijk in je indexfondsen`);
    const col = DV.score >= 80 ? "var(--pos)" : DV.score >= 60 ? "var(--warning)" : "var(--neg)";
    dc.body.append(el("div", {style: "display:flex;align-items:baseline;gap:8px;margin-bottom:8px"},
      el("div", {style: `font-size:40px;font-weight:600;color:${col}`}, String(DV.score)), el("div", {class: "muted"}, "/ 100")));
    if (DV.penalties.length) dc.body.append(el("ul", {class: "checklist"}, DV.penalties.map(p => el("li", {}, p.points ? `−${p.points}: ${p.text}` : p.text))));
    else dc.body.append(el("div", {class: "muted"}, "Niets dat de score drukt."));
    dc.body.append(el("div", {class: "note", style: "margin-top:6px"}, [`effectief ${num1.format(DV.effective_sectors)} sectoren`,
      DV.top_region ? `grootste regio ${DV.top_region.name} ${pct(DV.top_region.weight)}` : null, `${pct(DV.funds_share)} in fondsen`,
      `crypto ${pct(DV.crypto_share)}`].filter(Boolean).join(" · ") + ". Een vuistregel, geen advies."));
    out.push(dc.root);
  }
  // 3. look-through
  const LT = R.look_through;
  if (LT) {
    const st = {dim: "regions"};
    const lc = card("Doorkijk: wat zit er echt in", "Indexfondsen opgesplitst in regio's en sectoren (benaderende indexgewichten)", {table: () => table([
      {label: st.dim === "regions" ? "Regio" : "Sector", get: r => r.bucket}, {label: "Waarde", num: true, get: r => eur(r.value)}, {label: "Aandeel", num: true, get: r => pct(r.weight)}], LT[st.dim])});
    const seg = el("div", {class: "seg", role: "group", "aria-label": "Doorkijk volgens", style: "margin-bottom:10px"}), host = el("div");
    const draw = () => {
      seg.textContent = "";
      for (const [d, l] of [["regions", "Regio's"], ["sectors", "Sectoren"]]) seg.append(el("button", {type: "button", "aria-pressed": String(d === st.dim), onclick: () => { st.dim = d; draw(); }}, l));
      hbars(host, LT[st.dim].map(r => ({label: r.bucket, value: r.value, w: r.weight})), {color: st.dim === "regions" ? "var(--s1)" : "var(--s3)",
        fmt: (v, it) => `${pct(it.w != null ? it.w : v / LT[st.dim].reduce((a, r) => a + r.value, 0))} · ${eur(v)}`});
    };
    lc.body.append(seg, host);
    requestAnimationFrame(draw);
    const notes = LT.overlaps.map(o => o.text);
    if (LT.unknown_sector_share > 0.02) notes.push(`${pct(LT.unknown_sector_share)} zonder gekende sector (aandelen of fondsen die de doorkijk niet kent): zeg tegen Claude bv. “NVIDIA is IT”.`);
    if (notes.length) lc.body.append(el("div", {class: "note", style: "margin-top:8px"}, notes.join(" ")));
    out.push(lc.root);
  }
  // 4. risk of the current mix
  const HR = R.holdings_risk;
  if (HR && HR.available) {
    const hc = card("Risico van je huidige mix", `Je verdeling van vandaag over ${HR.months} maanden koersen (${mLabel(HR.from)} – ${mLabel(HR.to)})`, {cls: "span2", table: () => table([
      {label: "Positie", get: r => r.name}, {label: "Gewicht", num: true, get: r => pct(r.weight)}, {label: "Volatiliteit", num: true, get: r => r.volatility == null ? "—" : pct(r.volatility)},
      {label: "Deel van het risico", num: true, get: r => r.risk_share == null ? "—" : pct(r.risk_share)}, {label: "Slechtste maand", num: true, get: r => pc(r.worst_month)}], HR.holdings)});
    hc.body.append(el("div", {class: "grid g3", style: "margin-bottom:10px"},
      tile("Volatiliteit", HR.volatility == null ? "—" : pct(HR.volatility), "per jaar"), tile("Grootste daling", pc(HR.max_drawdown), "van top tot dal"),
      tile("Slechtste maand", pc(HR.worst_month), `beste ${pc(HR.best_month)}`)));
    const top = HR.holdings.filter(h => h.risk_share != null).slice(0, 8), host = el("div");
    hc.body.append(el("div", {class: "muted small", style: "margin-bottom:4px"}, "Deel van het totale risico per positie, tegenover het gewicht"), host);
    requestAnimationFrame(() => hbars(host, top.map(h => ({label: h.name, value: h.risk_share * 100, w: h.weight})), {color: "var(--s5)",
      fmt: (v, it) => it.__other ? `${num1.format(v)} %` : `${num1.format(v)} % · gewicht ${pct(it.w)}`}));
    const hi = (HR.correlations || []).filter(c => c.correlation >= 0.85).slice(0, 3);
    hc.body.append(el("div", {class: "note", style: "margin-top:6px"}, (hi.length ? `Bewegen bijna samen: ${hi.map(c => `${c.a} en ${c.b} (${c.correlation.toFixed(2).replace(".", ",")})`).join("; ")}. ` : "") +
      (HR.coverage < 0.98 ? `${pct(HR.coverage)} van je posities heeft koershistoriek. ` : "") + HR.note));
    out.push(hc.root);
  }
  return out;
}

function analysisCards() {
  const A_ = X("analysis");
  if (!A_) return [];
  if (!(A_.allocation && A_.allocation.total)) return [];  // nothing to analyse without positions (hint card instead)
  const AL = A_.allocation, out = [];
  const state2 = {dim: "class"};
  const al = card("Spreiding en doelen", `Totaal ${eur(AL.total)} · top 5 posities ${pct(AL.concentration.top5_weight)}`, {
    table: () => table([{label: "Groep", get: r => r.bucket}, {label: "Waarde", num: true, get: r => eur(r.value)}, {label: "Aandeel", num: true, get: r => pct(r.weight)},
      {label: "Doel", num: true, get: r => r.target == null ? "—" : pct(r.target)}, {label: "Afwijking", num: true, get: r => r.deviation_eur == null ? "—" : eurS(r.deviation_eur)}],
      AL.dimensions[state2.dim].rows)});
  const seg = el("div", {class: "seg", role: "group", "aria-label": "Spreiding volgens", style: "margin-bottom:10px"});
  const host = el("div"), tgt = el("div", {style: "margin-top:10px"});
  const draw = () => {
    seg.textContent = "";
    for (const d of Object.keys(AL.dimensions)) seg.append(el("button", {type: "button", "aria-pressed": String(d === state2.dim), onclick: () => { state2.dim = d; draw(); }}, DIM_NL[d] || d));
    const rows = AL.dimensions[state2.dim].rows.filter(r => r.value > 0);
    const NL = state2.dim === "class" ? (x => CLASS_NL[x] || x) : (x => x);
    segmented(host, rows.map((r, i) => ({label: NL(r.bucket), value: r.value, color: ["var(--s1)", "var(--s3)", "var(--s2)", "var(--s4)", "var(--s7)", "var(--s5)", "var(--s8)", "var(--s6)"][i % 8], dark: i === 1 || i === 3})));
    tgt.textContent = "";
    const dim = AL.dimensions[state2.dim];
    if (dim.has_targets) {
      tgt.append(table([{label: "Groep", get: r => NL(r.bucket)}, {label: "Nu", num: true, get: r => pct(r.weight)}, {label: "Doel", num: true, get: r => pct(r.target)},
        {label: "Afwijking", num: true, get: r => el("span", {style: `color:${Math.abs(r.deviation) > 0.05 ? "var(--warning)" : "inherit"}`}, (r.deviation > 0 ? "+" : "") + num1.format(r.deviation * 100) + " pt")},
        {label: "Bijsturen", num: true, get: r => eurS(-r.deviation_eur)}], dim.rows));
      tgt.append(el("div", {class: "note", style: "margin-top:4px"}, "Bijsturen = kopen (+) of verkopen (−) om exact op doel te komen. Met nieuw geld: vraag Claude “hoe verdeel ik € … over mijn doelen?”."));
    } else tgt.append(el("div", {class: "note"}, `Nog geen doelen voor ${(DIM_NL[state2.dim] || state2.dim).toLowerCase()}: zeg tegen Claude bv. “mijn doel is 80 % ETF, 10 % crypto, 10 % obligaties”.`));
  };
  al.body.append(seg, host, tgt, el("div", {class: "note", style: "margin-top:8px"}, AL.notes.join(" ")));
  requestAnimationFrame(draw);
  out.push(al.root);
  const DV = A_.dividends;
  const dv = card("Dividendkalender", `Komende 12 maanden ±${eur(DV.total_12m)} bruto`, {
    table: () => table([{label: "Verwacht", get: r => dLabel(r.expected_date)}, {label: "Positie", get: r => r.instrument}, {label: "Rekening", get: r => r.account},
      {label: "Bruto", num: true, get: r => eur(r.expected_gross)}, {label: "Bronheffing", num: true, get: r => r.withholding_rate ? pct(r.withholding_rate) : "—"}], DV.items)});
  const dh = el("div");
  dv.body.append(dh, el("div", {class: "note", style: "margin-top:6px"}, DV.note));
  requestAnimationFrame(() => hbars(dh, DV.months.map(m => ({label: mLabel(m.month), value: m.expected_gross})), {max: 12, color: "var(--s3)"}));
  out.push(dv.root);
  const B = A_.benchmark || {};
  const bc = card(`Vergelijking met ${(B.benchmark || {}).name || "benchmark"}`, B.available ? B.note : (B.note || ""), {cls: "span4"});
  if (B.available) {
    bc.body.append(el("div", {class: "grid g4", style: "margin-bottom:10px"},
      tile("Jouw beleggingsrekeningen", eur(B.value), B.xirr != null ? `XIRR ${pctS(B.xirr)}` : ""),
      tile("Zelfde stortingen in de benchmark", eur(B.benchmark_value), B.benchmark_xirr != null ? `XIRR ${pctS(B.benchmark_xirr)}` : ""),
      tile("Verschil", eurS(B.difference), B.difference >= 0 ? "beter dan de benchmark" : "minder dan de benchmark"),
      tile("Rekeningen", String(B.accounts.length), B.accounts.map(a => a.account).join(", "))));
    bc.body.append(table([{label: "Rekening", get: r => r.account}, {label: "Sinds", num: true, get: r => dLabel(r.since)}, {label: "Netto gestort", num: true, get: r => eur(r.net_deposits)},
      {label: "Waarde", num: true, get: r => eur(r.value)}, {label: "In benchmark", num: true, get: r => eur(r.benchmark_value)},
      {label: "Verschil", num: true, get: r => el("span", {style: `color:${r.difference < 0 ? "var(--neg)" : "inherit"}`}, eurS(r.difference))}], B.accounts));
  } else bc.body.append(el("div", {class: "empty"}, B.note || "Niet beschikbaar."));
  out.push(bc.root);
  return out;
}

// The same model as centen/planner.py (keep both in step).
function planPensionCapital(I, stop, inf) {
  const accs = I.pension_accounts, age0 = I.age, retAge = I.retirement_age || 67;
  if (!accs || age0 == null) return I.pension_capital_at_retirement_today_eur || 0;
  const years = Math.max(0, retAge - age0), paying = Math.max(0, Math.min(years, (stop ?? retAge) - age0));
  let total = 0;
  for (const a of accs) {
    const r = a.return, g = (1 + r) ** paying;
    let fv = a.value * g + (r ? a.premium * (g - 1) / r : a.premium * paying);
    fv *= (1 + r) ** (years - paying);
    if (a.expected && paying >= years - 0.05) fv = a.expected;
    total += fv / (1 + inf) ** years * (1 - a.tax);
  }
  return total;
}
function planProject(I, sc) {
  const ret = sc.ret ?? I.return, inf = sc.inf ?? I.inflation, wr = sc.wr ?? I.withdrawal_rate;
  const real = (1 + ret) / (1 + inf) - 1;
  const company = I.include_company ? ((I.cash_company || 0) + (I.investments_company || 0)) * (1 - (I.company_extraction_tax || 0.15)) : 0;
  let capital = (I.cash_personal || 0) + (I.investments_personal || 0) + company;
  let loans = (I.loans || []).filter(x => x.instalment_monthly);
  const spc = sc.spend || 0, payoff = !!sc.payoff;
  const instalNow = loans.reduce((a, x) => a + x.instalment_monthly * 12, 0);
  if (payoff) { capital -= loans.reduce((a, x) => a + (x.outstanding || 0), 0); }
  let baseSpend = (I.annual_spending || 0) * (1 + spc);
  if (payoff) baseSpend -= instalNow * (1 + spc);
  let saving = (I.monthly_saving || 0) * 12 + (sc.extra || 0) * 12 - (I.annual_spending || 0) * spc;
  if (payoff) { saving += instalNow; loans = []; }
  const age0 = I.age, retAge = I.retirement_age || 67, endAge = I.live_until || 90;
  const n = age0 != null ? Math.floor(endAge - age0) + 1 : 40;
  const pensionY = (I.legal_pension_monthly || 0) * 12;
  let stop = sc.stop !== undefined ? sc.stop : (I.stop_work_age ?? null);
  if (stop != null && stop >= retAge) stop = null;
  const pcap = planPensionCapital(I, stop, inf);
  const year0 = +I.today.slice(0, 4);
  const rows = []; let fi = null, depleted = null;
  for (let i = 0; i <= n; i++) {
    const y = year0 + i, age = age0 != null ? age0 + i : null;
    const ended = loans.filter(x => x.ends && +x.ends.slice(0, 4) < y);
    const spend = baseSpend - ended.reduce((a, x) => a + x.instalment_monthly * 12 * (1 + spc), 0);
    const retired = age != null && age >= retAge;
    const working = !retired && (stop == null || age == null || age < stop);
    const need = Math.max(0, spend - (retired ? pensionY : 0));
    if (fi == null && capital > 0 && capital * wr >= need) fi = {year: y, age};
    rows.push({year: y, age, capital, spending: spend, target: need / wr});
    if (i === n) break;
    const freed = ended.reduce((a, x) => a + x.instalment_monthly * 12, 0);  // a paid-off loan's instalment is saved
    let flow = working ? saving + freed : -spend;
    if (retired) flow = pensionY - spend;
    capital = capital * (1 + real) + flow;
    if (retired && Math.abs(age - retAge) < 1 && pcap) capital += pcap;
    if (capital < 0 && depleted == null) depleted = {year: y + 1, age: age != null ? age + 1 : null};
  }
  const atRet = rows.find(r => r.age != null && r.age >= retAge);
  return {rows, fi, depleted, atRet: atRet ? atRet.capital : null, real};
}


// Pay off early or invest: the same calculation as centen/prepay.py (keep both in step).
function ppAnnuity(b, r, n) { return n <= 0 ? b : (r === 0 ? b / n : b * r / (1 - (1 + r) ** -n)); }
function ppPayments(b, r, inst, n) {

    if (b <= 0.005) { out.push(0); continue; }
    b = b * (1 + r);

    b -= pay; out.push(pay);

}
const ppAfterTax = (v, paid, tax) => paid + Math.max(0, v - paid) * (1 - tax);

    let lo = 0, hi = 0.25; if (g(lo) < 0) return 0; if (g(hi) > 0) return null;

    lower: {instalment: instLow, drop: inst - instLow, saved: sum(keep) - x - sum(low), fv: lFv, adv: lFv - inv, be: be("low")}};
}

    `Leeftijd ${I.age != null ? Math.floor(I.age) : "onbekend (geboortedatum in het pensioenprofiel)"} · ${I.stop_work_age < I.retirement_age ? "stoppen met werken op " + I.stop_work_age + " · " : ""}pensioen op ${I.retirement_age} · wettelijk pensioen ${I.legal_pension_monthly != null ? eur(I.legal_pension_monthly) + " / maand" : "niet ingevuld"}.`,
    `Cash privé ${eur(I.cash_personal)}, beleggingen privé ${eur(I.investments_personal)}` + (I.include_company ? `, BV ${eur((I.cash_company || 0) + (I.investments_company || 0))}` + (I.company_tax_owed ? ` na ${eur(I.company_tax_owed)} nog te betalen btw en VenB` : "") + ` (niet vrij: telt pas na ${pct(I.company_extraction_tax)} roerende voorheffing bij uitkeren)` : "") + ".",
    `Pensioenkapitaal 2e/3e pijler nu ${eur(I.pension_capital_now)}; vanaf je pensioen na belasting, met premies zolang je werkt (de schuif ‘stoppen’ telt mee).`,
    "Sparen en extra sparen lopen enkel zolang je werkt; daarna leef je van je vermogen tot je pensioen.",
    `Sparen ${eur(I.monthly_saving)} per maand (inkomen − uitgaven, privé + BV, laatste 12 maanden) · uitgaven ${eur(I.annual_spending)} per jaar.`,
    (I.loans || []).length ? `Leningen: ${I.loans.map(l => `${l.name} ${eur(l.instalment_monthly)}/maand tot ${dLabel(l.ends)}`).join("; ")} (de uitgaven dalen als ze aflopen).` : "Geen leningen met een aflossingsplan.",
    PL.disclaimer]));
  v.append(g);
  prepayCard(v);
}

const VIEWS = {possessions: viewPossessions, fixed: viewFixed, forecast: viewForecast, pension: viewPension, planner: viewPlanner, tax: viewTax, total: viewTotal, personal: viewPersonal, business: viewBusiness, household: viewHousehold, invest: viewInvest, accounts: viewAccounts};
function render() {
  hideTip();
  renderTabs(); renderFilters();
  const v = document.getElementById("view"); v.textContent = "";
  const band = pillarBand(sectionOf(state.tab));
  if (band) v.append(band);
  VIEWS[state.tab](v);
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
render();
</script>
