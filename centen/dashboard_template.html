<script>
"use strict";
const D = JSON.parse(document.getElementById("centen-data").textContent);

// ---------- formatting ----------
const fmt0 = new Intl.NumberFormat("nl-BE", {style: "currency", currency: "EUR", maximumFractionDigits: 0});

const num1 = new Intl.NumberFormat("nl-BE", {maximumFractionDigits: 1});
const eur = v => v == null || isNaN(v) ? "—" : (Math.abs(v) < 100 && v % 1 !== 0 ? fmt2 : fmt0).format(v);
const eurS = v => v == null ? "—" : (v > 0 ? "+" : "") + eur(v);
const pct = v => v == null ? "—" : num1.format(v * 100) + "%";
function axisEur(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toLocaleString("nl-BE", {maximumFractionDigits: 1}) + " mln";
  if (a >= 10000) return Math.round(v / 1000).toLocaleString("nl-BE") + "k";
  return Math.round(v).toLocaleString("nl-BE");
}
const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const mLabel = m => MONTHS[+m.slice(5, 7) - 1] + " " + m.slice(2, 4);
const dLabel = d => d ? `${+d.slice(8, 10)} ${MONTHS[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "—";

const CAT = {
  "Salary": "Loon", "Child benefit (Groeipakket)": "Groeipakket", "Healthcare refunds": "Terugbetaling ziekenfonds",

  "Rental income": "Huurinkomsten", "Refunds": "Terugbetalingen", "Gifts received": "Schenkingen",
  "Other income": "Overige inkomsten", "Director remuneration": "Bezoldiging bedrijfsleider", "Dividends": "Dividenden",

  "Home & DIY": "Wonen & doe-het-zelf", "Groceries": "Boodschappen", "Restaurants & takeaway": "Restaurant & afhaal",
  "Insurance": "Verzekeringen", "Health insurance (mutualiteit)": "Ziekenfonds", "Healthcare": "Gezondheid",
  "Public transport & taxi": "Openbaar vervoer & taxi", "Fuel": "Brandstof", "EV charging": "Laden",
  "Parking & tolls": "Parking & tol", "Car & maintenance": "Auto", "Taxes & social security": "Belastingen & sociale bijdragen",
  "Childcare & school": "Kinderopvang & school", "Subscriptions & streaming": "Abonnementen", "News & magazines": "Kranten",
  "Shopping": "Shopping", "Clothing & shoes": "Kleding & schoenen", "Electronics": "Elektronica",

  "Travel & holidays": "Reizen", "Gifts & donations": "Giften", "Education": "Opleiding", "Post & shipping": "Post",
  "Bank fees": "Bankkosten", "Cash withdrawal": "Cash", "Online payments": "Online betalingen", "Other expenses": "Overige uitgaven",
};
const cat = c => CAT[c] || c;
const CADENCE = {"weekly": "wekelijks", "every 2 weeks": "tweewekelijks", "monthly": "maandelijks", "every 2 months": "tweemaandelijks",
  "quarterly": "per kwartaal", "every 6 months": "halfjaarlijks", "yearly": "jaarlijks"};
const nlName = s => (s || "").replace(/^Joint \((.*)\)$/, "Gedeeld ($1)").replace(/ - other account \(not linked\)$/, " – andere rekening (niet gekoppeld)")
  .replace(/^Own account /, "Eigen rekening ").replace(/ \(via Warrants \((.*)\)\)$/, " (warranten via $1)").replace(/^Warrants \((.*)\)$/, "Warranten ($1)");

const TYPE_NL = {investment: "Beleggingsrekening", crypto: "Crypto", pension: "Pensioen", insurance: "Tak 21/23",
  property: "Vastgoed", asset: "Andere", loan: "Lening"};
const TYPE_GROUP_NL = {investment: "Beleggingen", crypto: "Crypto", pension: "Pensioen", insurance: "Verzekering (tak 21/23)",
  property: "Vastgoed", asset: "Andere", not_added: "Nog niet toegevoegd (inleg)"};
const TYPE_COLOR = {investment: "var(--s1)", crypto: "var(--s2)", pension: "var(--s3)", insurance: "var(--s4)",
  property: "var(--s5)", asset: "var(--s7)", not_added: "var(--axis)"};
const CLASS_NL = {etf: "ETF", equity: "Aandelen", fund: "Fondsen", bond: "Obligaties", crypto: "Crypto", cash: "Cash", other: "Andere"};
const prettyPattern = p => p.replace(/\\b/g, "").replace(/\\s/g, " ").split("|").join(" / ");
const recognised = r => [...r.recognised_by.filter(x => x.pattern).map(x => `“${prettyPattern(x.pattern)}”`), ...r.recognised_by.filter(x => x.account).map(x => x.account)];
const pctS = v => v == null ? "—" : (v > 0 ? "+" : "") + num1.format(v * 100) + "%";

// ---------- DOM helpers (all data goes in via textContent) ----------
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const tip = document.getElementById("tip");
function showTip(evt, head, rows) {
  tip.textContent = "";
  if (head) tip.append(el("div", {class: "h"}, head));
  for (const r of rows) tip.append(el("div", {class: "r"},
    el("span", {}, r.color ? el("i", {class: "key-line", style: `background:${r.color}`}) : null, r.name), el("b", {}, r.value)));
  tip.style.display = "block";
  const rect = tip.getBoundingClientRect();
  let x = (evt.clientX ?? 0) + 14, y = (evt.clientY ?? 0) + 14;
  if (x + rect.width > innerWidth - 8) x = (evt.clientX ?? 0) - rect.width - 14;
  if (y + rect.height > innerHeight - 8) y = innerHeight - rect.height - 8;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
const hideTip = () => { tip.style.display = "none"; };

function table(cols, rows) {
  const t = el("table", {class: "t"});
  t.append(el("thead", {}, el("tr", {}, cols.map(c => el("th", {class: c.num ? "num" : null}, c.label)))));
  const tb = el("tbody");
  for (const r of rows) tb.append(el("tr", {}, cols.map(c => el("td", {class: c.num ? "num" : null}, c.get(r)))));
  t.append(tb);
  return t;
}

function card(title, sub, opts = {}) {
  const body = el("div");
  const tableBox = el("div", {hidden: true});
  const head = el("div", {class: "card-h"}, el("div", {}, el("div", {class: "card-t"}, title), sub ? el("div", {class: "card-s"}, sub) : null));
  if (opts.table) {
    const btn = el("button", {class: "toggle", type: "button", "aria-pressed": "false"}, "Tabel");
    btn.addEventListener("click", () => {
      const on = btn.getAttribute("aria-pressed") !== "true";
      btn.setAttribute("aria-pressed", String(on)); btn.textContent = on ? "Grafiek" : "Tabel";
      if (on && !tableBox.firstChild) tableBox.append(opts.table());
      tableBox.hidden = !on; body.hidden = on;
    });
    head.append(btn);
  }
  const root = el("section", {class: "card " + (opts.cls || "")}, head, body, tableBox);
  return {root, body};
}

function tile(label, value, sub, cls) {
  return el("div", {class: "card tile " + (cls || "")}, el("div", {class: "lbl"}, label), el("div", {class: "val"}, value),
    sub ? el("div", {class: "sub"}, sub) : null);
}

// ---------- charts ----------
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
function niceTicks(lo, hi, n = 5) {
  if (lo === hi) { hi = lo + 1; }
  const raw = (hi - lo) / (n - 1), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  const out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v * 100) / 100);
  return out;
}

function lineChart(host, {labels, series, height = 250, area = false, fmtX = mLabel, refs = []}) {
  host.textContent = "";
  if (!labels.length) { host.append(el("div", {class: "empty"}, "Geen gegevens in deze periode.")); return; }
  if (series.length >= 2) host.append(el("div", {class: "legend"},
    series.map(s => el("span", {}, el("i", {class: "key-line", style: `background:${s.color}`}), s.name))));
  const W = Math.max(320, host.clientWidth || 600), H = height;
  const directLabels = series.length <= 4;
  const m = {l: 52, r: directLabels ? 92 : 16, t: 10, b: 26};
  const vals = series.flatMap(s => s.values).filter(v => v != null).concat(refs.map(r => r.value));
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const n = labels.length, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const x = i => m.l + (n <= 1 ? iw / 2 : i * iw / (n - 1));
  const y = v => m.t + (hi - v) / (hi - lo) * ih;
  const svg = sv("svg", {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": series.map(s => s.name).join(", ")});
  for (const t of ticks) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: t === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1}));
    svg.append(sv("text", {x: m.l - 8, y: y(t) + 4, "text-anchor": "end"}, axisEur(t)));
  }
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 64))));
  labels.forEach((l, i) => { if (i % every === 0 || i === n - 1 && n < 14) svg.append(sv("text", {x: x(i), y: H - 6, "text-anchor": "middle"}, fmtX(l))); });
  for (const r of refs) {
    svg.append(sv("line", {x1: m.l, x2: W - m.r, y1: y(r.value), y2: y(r.value), stroke: r.color || "var(--warning)", "stroke-width": 1.5, "stroke-dasharray": "5 4"}));
    svg.append(sv("text", {x: m.l + 6, y: y(r.value) - 5}, r.label));
  }
  const ends = [];
  for (const s of series) {
    let d = "";
    s.values.forEach((v, i) => { if (v == null) return; d += (d ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });
    if (area) {
      const firstI = s.values.findIndex(v => v != null);
      svg.append(sv("path", {d: d + `L${x(n - 1)} ${y(0)}L${x(firstI)} ${y(0)}Z`, fill: s.color, "fill-opacity": 0.1, stroke: "none"}));
    }
    svg.append(sv("path", {d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}));
    const li = s.values.length - 1;
    if (s.values[li] != null) {
      svg.append(sv("circle", {cx: x(li), cy: y(s.values[li]), r: 4, fill: s.color, stroke: "var(--card)", "stroke-width": 2}));
      ends.push({y: y(s.values[li]), name: s.name, v: s.values[li]});
    }
  }
  if (directLabels && ends.length) {
    ends.sort((a, b) => a.y - b.y);
    const clash = ends.some((e, i) => i && e.y - ends[i - 1].y < 15);
    if (!clash) for (const e of ends) svg.append(sv("text", {class: "end", x: W - m.r + 10, y: e.y + 4}, axisEur(e.v)));
  }
  const cross = sv("line", {y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden"});
  svg.append(cross);
  const marks = series.map(s => { const c = sv("circle", {r: 4, fill: s.color, stroke: "var(--card)", "stroke-width": 2, visibility: "hidden"}); svg.append(c); return c; });
  const hit = sv("rect", {x: m.l - 8, y: m.t, width: iw + 16, height: ih, fill: "transparent", tabindex: 0, "aria-label": "Grafiek: gebruik pijltjestoetsen"});
  let cur = -1;
  const show = (i, evt) => {
    cur = Math.max(0, Math.min(n - 1, i));
    cross.setAttribute("x1", x(cur)); cross.setAttribute("x2", x(cur)); cross.setAttribute("visibility", "visible");
    series.forEach((s, k) => { const v = s.values[cur]; if (v == null) { marks[k].setAttribute("visibility", "hidden"); return; }
      marks[k].setAttribute("cx", x(cur)); marks[k].setAttribute("cy", y(v)); marks[k].setAttribute("visibility", "visible"); });
    const r = svg.getBoundingClientRect();
    const e = evt || {clientX: r.left + x(cur), clientY: r.top + m.t + 10};
    showTip(e, fmtX(labels[cur], true), series.map(s => ({name: s.name, value: eur(s.values[cur]), color: s.color})));
  };
  hit.addEventListener("pointermove", e => { const r = svg.getBoundingClientRect(); const px = e.clientX - r.left;
    show(Math.round((px - m.l) / (iw / Math.max(1, n - 1))), e); });
  hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); marks.forEach(c => c.setAttribute("visibility", "hidden")); hideTip(); });
  hit.addEventListener("keydown", e => { if (e.key === "ArrowRight") show(cur + 1); if (e.key === "ArrowLeft") show(cur - 1); });
  hit.addEventListener("focus", () => show(n - 1));
  hit.addEventListener("blur", () => { hideTip(); cross.setAttribute("visibility", "hidden"); });
  svg.append(hit);
  host.append(svg);
}

function hbars(host, items, {color = "var(--s1)", signed = false, max = 12, label = x => x.label, value = x => x.value, extra} = {}) {
  host.textContent = "";
  let list = items.filter(i => Math.abs(value(i)) >= 0.5);
  if (!list.length) { host.append(el("div", {class: "empty"}, "Niets in deze periode.")); return; }
  if (list.length > max) {
    const rest = list.slice(max - 1);
    list = list.slice(0, max - 1).concat([{__other: true, label: `Overige (${rest.length})`, value: rest.reduce((a, b) => a + value(b), 0)}]);
  }
  const vals = list.map(i => i.__other ? i.value : value(i));
  const maxAbs = Math.max(...vals.map(Math.abs)) || 1;
  const hasNeg = signed && vals.some(v => v < 0);
  const box = el("div", {class: "bars"});
  list.forEach((it, idx) => {
    const v = vals[idx], name = it.__other ? it.label : label(it);
    const track = el("div", {class: "track"});
    const zeroAt = hasNeg ? 50 : 0, span = hasNeg ? 50 : 100;
    const w = Math.max(0.6, Math.abs(v) / maxAbs * span);
    const b = el("div", {class: "b" + (v < 0 ? " n" : ""), style: `background:${v < 0 ? "var(--neg)" : color};width:${w}%;` +
      (v < 0 ? `right:${100 - zeroAt}%` : `left:${zeroAt}%`)});
    track.append(b);
    if (hasNeg) track.append(el("div", {class: "zero", style: `left:${zeroAt}%`}));
    const row = [el("div", {class: "bl", title: name}, name), track, el("div", {class: "bv"}, signed ? eurS(v) : eur(v))];
    const enter = e => showTip(e, name, [{name: "Bedrag", value: eur(v)}].concat(extra && !it.__other ? extra(it) : []));
    row.forEach(r => { r.addEventListener("pointermove", enter); r.addEventListener("pointerleave", hideTip); box.append(r); });
  });
  host.append(box);
}

function segmented(host, parts) {
  host.textContent = "";
  const total = parts.reduce((a, p) => a + Math.max(0, p.value), 0) || 1;
  const bar = el("div", {class: "segbar", role: "img", "aria-label": parts.map(p => `${p.label} ${eur(p.value)}`).join(", ")});
  for (const p of parts) {
    if (p.value <= 0) continue;
    const share = p.value / total;
    const blk = el("div", {class: p.dark ? "dark" : "", style: `flex:${share} 1 0;background:${p.color}`, tabindex: 0});
    const txt = `${Math.round(share * 100)}%`;
    if (host.clientWidth * share > txt.length * 8 + 16) blk.textContent = txt;
    const enter = e => showTip(e, p.label, [{name: "Bedrag", value: eur(p.value)}, {name: "Aandeel", value: pct(share)}]);
    blk.addEventListener("pointermove", enter); blk.addEventListener("pointerleave", hideTip);
    blk.addEventListener("focus", () => { const r = blk.getBoundingClientRect(); enter({clientX: r.left + 10, clientY: r.bottom}); });
    blk.addEventListener("blur", hideTip);
    bar.append(blk);
  }
  host.append(bar, el("div", {class: "legend"}, parts.filter(p => p.value > 0).map(p =>
    el("span", {}, el("i", {class: "key-rect", style: `background:${p.color}`}), `${p.label} · ${eur(p.value)}`))));
}

const BROKERS = D.investments.by_destination.filter(d => Math.abs(d.net_deposited) >= 1).map(d => nlName(d.destination));
const brokerList = (n = 3) => BROKERS.length ? BROKERS.slice(0, n).join(", ") + (BROKERS.length > n ? ", …" : "") : "geen gevonden";

function periodMonths(key) {
  const p = D.periods[key];
  return [p.period.from.slice(0, 7), p.period.to.slice(0, 7)];

  return D.monthly[persp].filter(m => m.month >= a && m.month <= b);

const full = ms => ms.filter(m => !m.partial);
const partialNote = ms => ms.some(m => m.partial) ? ` · lopende maand ${mLabel(ms.find(m => m.partial).month)} enkel in de tabel` : "";

document.getElementById("meta").textContent =
  `Gegevens t.e.m. ${dLabel(D.meta.data_up_to)} · opgebouwd ${D.meta.generated} · bankgegevens, kasbasis`;
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";

// Keep the tab in the address bar when the page may change it; sandboxed previews (origin "null") refuse that.
function rememberTab(id) {
  try { history.replaceState(null, "", "#" + id); } catch (e) { /* preview frame: tab still switches */ }
}
function renderTabs() {
  const nav = document.getElementById("tabs"); nav.textContent = "";
  for (const t of TABS) {
    if (t === "|") { nav.append(el("span", {class: "tabsep", "aria-hidden": "true"})); continue; }
    const [id, name] = t;
    nav.append(el("button", {role: "tab", type: "button", "aria-selected": String(id === state.tab),
    onclick: () => { state.tab = id; render(); rememberTab(id); }}, name));
  }
  const act = nav.querySelector('[aria-selected="true"]');  // on a phone the bar scrolls: keep the open tab in view
  if (act && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = Math.max(0, act.offsetLeft - nav.clientWidth / 2 + act.offsetWidth / 2);
}
function renderFilters() {
  const f = document.getElementById("filters"); f.textContent = "";
  if (!PERIOD_TABS.has(state.tab)) {
    const NOTE = {invest: "Volledige historie · stand vandaag", tax: `Inkomstenjaar ${D.meta.today.slice(0, 4)} · rekenhulp, geen fiscaal advies`,
      fixed: "Gedetecteerd uit je betalingen + wat je zelf toevoegde", possessions: "Stand vandaag · waarden zoals ingegeven of geschat", forecast: "Schatting voor de komende 6 maanden",
      pension: "Projectie in euro van vandaag · geen pensioenberekening", planner: "Planningsmodel in euro van vandaag · geen advies"};
    if (state.tab === "forecast" && D.forecast && !D.forecast.error) {
      const seg = el("div", {class: "seg", role: "group", "aria-label": "Perspectief"});
      for (const [k, n] of [["personal", "Privé"], ["business", "BV"], ["total", "Totaal"]]) {
        if (!D.forecast.perspectives[k]) continue;
        seg.append(el("button", {type: "button", "aria-pressed": String(k === state.fp), onclick: () => { state.fp = k; render(); }}, n));
      }
      f.append(el("span", {class: "lbl"}, "Perspectief"), seg, el("span", {class: "note"}, NOTE.forecast));
      return;
    }
    f.append(el("span", {class: "note"}, NOTE[state.tab] || "Stand vandaag"));
    return;
  }
  const seg = el("div", {class: "seg", role: "group", "aria-label": "Periode"});
  for (const k of D.period_order) seg.append(el("button", {type: "button", "aria-pressed": String(k === state.period),
    onclick: () => { state.period = k; render(); }}, D.periods[k].label));
  f.append(el("span", {class: "lbl"}, "Periode"), seg);
}

function statusAlert(kind, title, detail, amount) {
  const color = {warning: "var(--warning)", serious: "var(--serious)", critical: "var(--critical)", good: "var(--good)", info: "var(--axis)"}[kind];
  const icon = {warning: "!", serious: "!", critical: "!", good: "✓", info: "i"}[kind];
  return el("div", {class: "alert"}, el("div", {class: "ic", style: `background:${color}`, "aria-hidden": "true"}, icon),
    el("div", {}, el("div", {class: "tt"}, title), detail ? el("div", {class: "dd"}, detail) : null),
    el("div", {class: "am"}, amount != null ? eur(Math.abs(amount)) : ""));
}
function alertItems(scope) {
  const T = {possible_duplicate: "Mogelijk dubbele betaling", higher_than_usual: "Hoger dan gewoonlijk", large_new_merchant: "Grote betaling aan nieuwe begunstigde",
    fee: "Kosten of debetrente", foreign_currency: "Betaling in vreemde munt", price_increase: "Prijsstijging"};
  return D.alerts.filter(a => !scope || a.scope === scope).map(a => {
    let d = `${nlName(a.merchant)} · ${dLabel(a.date)}`;
    if (a.type === "price_increase" && a.facts) d = `${nlName(a.merchant)}: ${eur(a.facts.from)} → ${eur(a.facts.to)} (${CADENCE[a.facts.cadence] || a.facts.cadence}) sinds ${dLabel(a.facts.since)}, ±${eur(a.facts.per_year)} per jaar meer`;
    if (a.type === "higher_than_usual" && a.facts) d += ` · ${num1.format(a.facts.ratio)}× je gebruikelijke ${eur(a.facts.usual)}`;
    if (a.type === "possible_duplicate" && a.facts) d += ` · ${a.facts.count}× hetzelfde bedrag`;
    const n = statusAlert(a.severity === "warning" ? "warning" : "info", T[a.type] || a.type, d, a.amount);
    if (!scope && HAS_BV) scopeChip(n, a.scope);
    return n;
  });
}
function scopeChip(node, scope) {
  const tt = node.querySelector(".tt");
  if (tt) tt.append(el("span", {class: "chip scope " + (scope === "business" ? "bv" : "pv"), style: "margin-left:8px"}, scope === "business" ? "BV" : "Privé"));
  return node;
}
function taxCheck() {
  const out = [];
  const y = String(new Date(D.meta.today).getFullYear());
  const p = D.periods[y];
  if (p && p.business.result_before_corporate_tax > 0 && p.business.corporate_tax_paid === 0) {
    out.push(scopeChip(statusAlert("serious", `Geen voorafbetaling vennootschapsbelasting in ${y}`,
      `Kasresultaat BV tot nu ${eur(p.business.result_before_corporate_tax)} (vóór VenB). Te bespreken met je boekhouder vóór de laatste voorafbetaling.`, null), "business"));
  }
  const exp = D.links.filter(l => l.status === "active" && l.days_left != null && l.days_left <= 30);
  for (const l of exp) out.push(statusAlert("warning", `Toestemming ${l.bank} verloopt binnenkort`, `Nog ${l.days_left} dagen (tot ${dLabel(l.valid_until)}): opnieuw koppelen met centen link.`, null));
  return out;
}

function cashSub(scope) {
  const acc = D.accounts.filter(a => (a.scope || "personal") === scope);
  const sav = acc.filter(a => a.type === "savings");
  return `${acc.filter(a => a.type === "current").length} zicht` + (sav.length ? ` + ${sav.length} spaar` : "") + (sav.some(a => a.estimated) ? " (spaar geschat)" : "");
}
function netWorthSub() {
  const W = D.net_worth, T = D.investments.totals, parts = ["Liquide middelen + beleggingen"];
  if (T.property) parts.push("woning");
  if (T.possessions) parts.push("bezittingen");
  let txt = parts.join(" + ") + (T.loans_outstanding ? " − leningen" : "") + ".";
  const est = D.investments.accounts.filter(a => a.estimated).length, noval = W.without_value.length;
  if (est) txt += ` ${est} waarde${est > 1 ? "n" : ""} geschat (laatste waarde + stortingen).`;
  if (noval) txt += ` Zonder waarde, aan inleg: ${W.without_value.join(", ")}.`;
  if (T.not_added_net_deposited) txt += ` Brokers nog niet toegevoegd tellen aan netto inleg.`;
  if (!T.property) txt += " Woning niet inbegrepen.";
  if (!T.loans_outstanding) txt += " Openstaande leningen niet ingegeven.";
  return txt;
}
function compositionParts() {
  const NW = D.net_worth || {}, cash = D.periods[D.meta.default_period].cash, T = D.investments.totals;
  const pens = (T.by_type || {}).pension || 0, invNoPension = investTotal() - pens;
  const owned = (NW.property || 0) + (NW.possessions || 0) - Math.abs(NW.loans || 0);
  return [
    {label: "Liquide privé", value: cash.personal || 0, color: "var(--s1)"},
    {label: "Liquide BV", value: cash.business || 0, color: "var(--s6)", dark: true},
    {label: "Beleggingen", value: invNoPension, color: "var(--s2)"},
    {label: "Pensioen", value: pens, color: "var(--s3)", dark: true},
    {label: "Woning en bezittingen − leningen", value: owned, color: "var(--s4)", dark: true},
  ].filter(x => x.value > 0.5);
}
function investTotal() { const T = D.investments.totals; return (T.investments_value || 0) + (T.not_added_net_deposited || 0); }
function viewTotal(v) {

  const investSub = () => { const PT = (D.investments.portfolio || {}).totals || {}; return (PT.day_change != null ? `vandaag ${eurS(PT.day_change)} · live ${PT.prices_as_of.slice(11, 16)} · ` : "") + (valued ? `${valued} rekening${valued > 1 ? "en" : ""} met waarde` + (NOT_ADDED.length ? ` + inleg ${NOT_ADDED.slice(0, 3).join(", ")}` : "")
      : `netto inleg · ${brokerList()}`); };
  const loanTile = () => L.length ? tile("Leningen", eur(SP ? SP.loans : T.loans_outstanding), "nog te betalen" + (D.loans.length ? ` · ${eur(D.loans.reduce((a, l) => a + l.monthly, 0))} / maand` : ""))

  const possTile = () => { const PO = D.possessions; return PO && !PO.error && PO.items.length

      : tile("Bezittingen", "—", "woning, wagen, horloge…: voeg ze toe in de bijwerk-app", "placeholder"); };
  if (!SP) {  // without the split (an error): the combined view as before

        el("div", {class: "sub"}, netWorthSub())),
      tile("Liquide privé", eur(cash.personal), cashSub("personal")),

    v.append(el("div", {class: "grid g4", style: "margin-top:14px"}, tile("Beleggingen", eur(investTotal()), investSub()),
      T.gain_on_valued_accounts != null ? tile("Rendement", eurS(T.gain_on_valued_accounts), `${pctS(T.gain_pct)} · waarde − inleg`) : tile("Rendement", "nog geen waarde", "geef de waarde van een beleggingsrekening in", "placeholder"),
      loanTile(), possTile()));
  } else {
    // --- privé: van jou ---
    v.append(el("h2", {class: "sec"}, "Privé ", el("span", {class: "chip scope pv"}, "van jou")));
    v.append(el("div", {class: "grid g4"},
      el("div", {class: "card tile hero span2"}, el("div", {class: "lbl"}, "Vrij beschikbaar"), el("div", {class: "val"}, eur(SP.available_now)),
        el("div", {class: "sub"}, `liquide ${eur(SP.cash)} + beleggingen ${eur(SP.investments)} · wat je kan uitgeven of verkopen zonder de BV`)),

function viewHousehold(v) {
  const h = P().household;

    table: () => table([{label: "Van", get: r => nlName(r.from)}, {label: "Naar", get: r => nlName(r.to)}, {label: "Soort", get: r => r.what.map(cat).join(", ")},
      {label: "Aantal", num: true, get: r => r.count}, {label: "Bedrag", num: true, get: r => eur(r.amount)}], h.flows)});
  const max = Math.max(1, ...h.flows.map(x => x.amount));
  if (!h.flows.length) f.body.append(el("div", {class: "empty"}, "Geen overschrijvingen in deze periode."));
  for (const x of h.flows) {
    const bar = el("div", {class: "track", style: "height:6px"}, el("div", {class: "b", style: `height:6px;left:0;width:${Math.max(1, x.amount / max * 100)}%;background:var(--s1)`}));
    f.body.append(el("div", {class: "flow"}, el("div", {}, nlName(x.from)), el("div", {class: "arr"}, "→"), el("div", {}, nlName(x.to)),
      el("div", {}, bar, el("div", {class: "what"}, `${x.what.map(cat).join(", ")} · ${x.count}×`)), el("div", {class: "amt"}, eur(x.amount))));
  }
  const g = el("div", {class: "grid g2"}, f.root);
  for (const [name, j] of Object.entries(h.joint_accounts)) {
    const inc = Object.entries(j.income_paid_in).map(([k, val]) => {
      const c = Object.keys(CAT).find(c => k.endsWith(` (${c})`));
      return {label: c ? nlName(k.slice(0, -c.length - 3)) : k, kind: c ? cat(c) : "", value: val};
    });
    const cj = card(`${nlName(name)}: wat komt er binnen`, "Inkomen rechtstreeks op de gedeelde rekening", {
      table: () => table([{label: "Bron", get: r => r.label}, {label: "Soort", get: r => r.kind}, {label: "Bedrag", num: true, get: r => eur(r.value)}], inc)});
    g.append(cj.root);
    requestAnimationFrame(() => hbars(cj.body, inc, {color: "var(--s3)", extra: r => [{name: "Soort", value: r.kind}]}));
    const tin = Object.entries(j.transfers_in_from), tout = Object.entries(j.transfers_out_to);
    const ct = card(`${nlName(name)}: overschrijvingen`, "Van en naar eigen rekeningen, de BV en het gezin");
    ct.body.append(table([{label: "Richting", get: r => r[2]}, {label: "Wie", get: r => nlName(r[0])}, {label: "Bedrag", num: true, get: r => eur(r[1])}],
      tin.map(r => [r[0], r[1], "binnen"]).concat(tout.map(r => [r[0], r[1], "buiten"]))));
    if (!tin.length && !tout.length) ct.body.append(el("div", {class: "empty"}, "Geen overschrijvingen."));
    g.append(ct.root);
  }
  v.append(g);
}

      ? el("span", {style: `color:${up ? "var(--pos)" : "var(--neg)"};margin-left:8px;font-weight:600`}, `vandaag ${eurS(PT.day_change)}`) : null);
}
function viewInvest(v) {
  const I = D.investments, T = I.totals;
  const accs = I.accounts.filter(a => !["property", "asset"].includes(a.type));

function copyText(txt, btn) {
  const done = () => { if (btn) { const o = btn.textContent; btn.textContent = "Gekopieerd ✓"; setTimeout(() => { btn.textContent = o; }, 1400); } };
  const fallback = () => {
    const ta = el("textarea", {style: "position:fixed;left:-9999px;top:0"}); ta.value = txt; document.body.append(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { prompt("Kopieer:", txt); } ta.remove();
  };
  try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
}

    {label: "Waardeverloop", get: r => r.depreciation ? `−${pct(r.depreciation.yearly_rate)} per jaar (${eur(r.depreciation.per_month_next_year)} / maand)` : "vaste waarde tot je ze aanpast"},
    {label: "Bijgewerkt", num: true, get: r => r.value_date ? dLabel(r.value_date) : "—"},

const GROUP_COLOR = {"Wonen & energie": "var(--s1)", "Lening": "var(--s7)", "Verzekeringen": "var(--s3)", "Abonnementen": "var(--s2)",
  "Kinderen": "var(--s5)", "Mobiliteit": "var(--s4)", "Gezondheid": "var(--s8)", "Lidmaatschappen": "var(--s6)",

const PAID_BY = {"direct debit": "domiciliëring", "standing order": "doorlopende opdracht", "card": "kaart", "transfer": "overschrijving",
  "instant": "overschrijving", "fee": "bankkosten", "other": "andere", "entered": "zelf ingevoerd"};
const shortDate = (d, long) => d ? (long ? dLabel(d) : `${+d.slice(8, 10)} ${MONTHS[+d.slice(5, 7) - 1]}`) : "—";
const scopeNl = s => s === "business" ? "BV" : "Privé";
function sectionError(v, x, what) {
  if (!x) { v.append(el("div", {class: "empty"}, `${what}: nog geen gegevens.`)); return true; }
  if (x.error) { v.append(statusAlert("warning", `${what} kon niet worden opgebouwd`, x.error)); return true; }
  return false;
}
const notesCard = (title, lines) => { const c = card(title, null); c.body.append(el("ul", {class: "checklist"}, lines.map(l => el("li", {}, l)))); return c.root; };

function viewFixed(v) {
  const F = D.fixed;
  if (sectionError(v, F, "Vaste kosten")) return;
  const P = F.totals.personal, B = F.totals.business;
  const ups = F.price_changes.filter(x => x.direction === "up");
  const subs = F.items.filter(i => i.status === "active" && i.group === "Abonnementen");
  v.append(el("div", {class: "grid g4"},
    el("div", {class: "card tile hero span2"}, el("div", {class: "lbl"}, "Vaste kosten privé per maand"), el("div", {class: "val"}, P ? eur(P.monthly) : "—"),
      el("div", {class: "sub"}, P ? `${eur(P.yearly)} per jaar · ${P.count} posten` + (F.fixed_share_of_income != null ? ` · ${pct(F.fixed_share_of_income)} van je vaste inkomen` : "") +
        (P.saving_monthly ? ` · daarnaast ${eur(P.saving_monthly)} vast sparen` : "") : "")),
    HAS_BV && B ? tile("Vaste kosten BV per maand", eur(B.monthly_excl_internal), `${eur(B.yearly_excl_internal)} per jaar, zonder bezoldiging en huur aan jou`) :
      tile("Abonnementen", String(subs.length), `${eur(subs.reduce((a, i) => a + i.monthly, 0))} per maand`),
    tile("Prijsstijgingen (12 mnd)", ups.length ? eurS(ups.reduce((a, x) => a + x.per_year, 0)) + " / jaar" : "geen", ups.length ? ups.slice(0, 3).map(x => x.name).join(", ") : "niets duurder geworden"),
  ));
  const g = el("div", {class: "grid g2", style: "margin-top:14px;align-items:start"});
  for (const scope of ["personal", "business"]) {
    const groups = F.groups.filter(x => x.scope === scope);
    if (!groups.length) continue;
    const c = card(`Per groep · ${scopeNl(scope)}`, "Per maand (jaarlijkse en kwartaalbetalingen omgerekend)", {table: () => table([
      {label: "Groep", get: r => r.group}, {label: "Posten", num: true, get: r => String(r.count)},
      {label: "Per maand", num: true, get: r => eur(r.monthly)}, {label: "Per jaar", num: true, get: r => eur(r.yearly)}], groups)});
    g.append(c.root);
    requestAnimationFrame(() => hbars(c.body, groups, {label: x => x.group, value: x => x.monthly, max: 14,

  }
  v.append(g);
  const att = [];
  for (const x of F.price_changes) att.push(statusAlert(x.direction === "up" ? "warning" : "good", `${x.name}: ${x.direction === "up" ? "duurder" : "goedkoper"} (${x.pct > 0 ? "+" : ""}${num1.format(x.pct)} %)`,
    `${eur(x.from)} → ${eur(x.to)} ${CADENCE[x.cadence] || x.cadence} sinds ${dLabel(x.since)} · ${eurS(x.per_year)} per jaar`, null));
  for (const x of F.overlaps) att.push(statusAlert("info", `Meerdere ${cat(x.category).toLowerCase()} (${scopeNl(x.scope)})`, `${x.names.join(", ")} · samen ${eur(x.yearly)} per jaar. Gebruik je ze allemaal?`, null));
  for (const x of F.stopped) att.push(statusAlert("info", `${x.name} lijkt gestopt`, `Laatste betaling ${dLabel(x.last_date)} (${CADENCE[x.cadence] || x.cadence}, ${eur(x.amount)}). Opgezegd? Dan hoeft er niets te gebeuren; anders: kijk na of de betaling mislukte.`, null));
  for (const x of F.big_coming) att.push(statusAlert("info", `${x.name}: ${eur(x.amount)} rond ${dLabel(x.date)}`, `${CADENCE[x.cadence] || x.cadence} · ${scopeNl(x.scope)}`, null));
  const a = card("Aandachtspunten", "Prijswijzigingen, overlap, gestopte betalingen en grote rekeningen in de komende 4 maanden");
  a.body.append(att.length ? el("div", {class: "alerts"}, att) : el("div", {class: "empty"}, "Niets opvallends."));
  a.root.style.marginTop = "14px";
  v.append(a.root);
  for (const scope of ["personal", "business"]) {
    const rows = F.items.filter(i => i.scope === scope);
    if (!rows.length) continue;
    rows.sort((x, y) => (x.status !== "active") - (y.status !== "active"));
    const c = card(`Alle vaste kosten · ${scopeNl(scope)}`, "Grijs = gestopt of opgezegd. Aanpassen: vraag het Claude (negeren, hernoemen, opgezegd, toevoegen) of centen fixed …");
    const t = table([{label: "Naam", get: r => el("span", {}, el("i", {class: "key-rect", style: `background:${GROUP_COLOR[r.group] || "var(--axis)"};margin-right:6px`}), r.name,
        r.source === "manual" ? el("span", {class: "muted"}, " · zelf ingevoerd") : null)},
      {label: "Groep", get: r => r.group}, {label: "Ritme", get: r => CADENCE[r.cadence] || r.cadence},
      {label: "Bedrag", num: true, get: r => eur(r.amount)}, {label: "Per jaar", num: true, get: r => r.status === "active" ? eur(r.yearly) : "—"},
      {label: "Volgende", num: true, get: r => r.status === "active" ? shortDate(r.next_date) : (r.status === "cancelled" ? "opgezegd" : "gestopt")},
      {label: "Via", get: r => PAID_BY[r.paid_by] || r.paid_by || "—"}], rows);
    [...t.tBodies[0].rows].forEach((tr, i) => { if (rows[i].status !== "active") tr.className = "off"; });
    c.body.append(t);
    c.root.style.marginTop = "14px";
    v.append(c.root);
  }
  if (F.income.length) {
    const c = card("Vaste inkomsten", "Regelmatige inkomsten die centen herkent (basis voor ‘van je vaste inkomen’)");
    c.body.append(table([{label: "Van", get: r => r.name}, {label: "Soort", get: r => cat(r.category)}, {label: "Ritme", get: r => CADENCE[r.cadence] || r.cadence},
      {label: "Bedrag", num: true, get: r => eur(r.amount)}, {label: "Volgende", num: true, get: r => shortDate(r.next_date)}, {label: "", get: r => scopeNl(r.scope)}], F.income));
    c.root.style.marginTop = "14px";
    v.append(c.root);
  }
}

    {label: "Uit", num: true, get: r => eur(r.out)}, {label: "Netto", num: true, get: r => eurS(r.net)}], mrows));

  const ci = card("Nieuwe inleg in je beleggingen", INV.override ? `Je rekent zelf met ${eur(INV.yearly)} per jaar (historisch gemiddelde ${eur(INV.yearly_from_history)}).` :
    `Gebruikt: ${eur(INV.yearly)} per jaar, het gemiddelde van de laatste ${num1.format(INV.window_years)} jaar. Aanpassen: vraag het Claude of centen pension --investing <bedrag>.`, {table: () => table([
      {label: "Jaar", get: r => r.year}, {label: "Netto ingelegd", num: true, get: r => eurS(r.net)}], INV.per_year)});
  g3.append(ci.root);
  requestAnimationFrame(() => INV.per_year.length ? hbars(ci.body, INV.per_year, {label: x => x.year, value: x => x.net, signed: true, max: 14}) :
    ci.body.append(el("div", {class: "empty"}, "Nog geen stortingen gezien.")));
  v.append(g3);
  const a = card("Aandachtspunten", null);
  a.body.append(O.checks.length ? el("div", {class: "alerts"}, O.checks.map(x => statusAlert(x.severity === "warning" ? "warning" : "info", x.text, null, null))) : el("div", {class: "empty"}, "Niets."));
  a.root.style.marginTop = "14px";
  v.append(a.root);
  const pr = O.profile;
  v.append(el("div", {style: "margin-top:14px"}, notesCard("Aannames (aanpasbaar via Claude: set_pension_profile)", [
    `Pensioenleeftijd ${pr.retirement_age}; ${pr.birth_date ? "geboren " + dLabel(pr.birth_date) : "geboortedatum nog niet ingevuld"}.`,
    O.stop_work_age < pr.retirement_age ? `Je stopt met werken op ${O.stop_work_age}: premies en nieuwe inleg lopen tot dan (nog ${num1.format(O.years_paying)} jaar), daarna leef je tot je pensioen van je eigen vermogen.`
      : `Premies en nieuwe inleg lopen door tot je pensioen. Vroeger stoppen? Vraag het Claude (stop_work_age) of probeer het in de Planner.`,
    `Rendement 2e/3e pijler ${pct(pr.return_pension)}, eigen beleggingen ${pct(pr.return_investments)}, inflatie ${pct(pr.inflation)} per jaar.`,
    `2e pijler: ongeveer ${pct(pr.payout_tax)} belasting en bijdragen bij uitkering, verdeeld tot ${pr.live_until} jaar. Eigen beleggingen: ${pct(pr.withdrawal_rate)} per jaar opnemen.`,
    `Pensioensparen ${O.limits_2026 ? "2026: max " + eur(O.limits_2026.pension_saving["30%"]) + " (30 %) of " + eur(O.limits_2026.pension_saving["25%"]) + " (25 %) per persoon" : ""}.`,
    O.notes])));
}

// The same model as centen/planner.py (keep both in step).
function planPensionCapital(I, stop, inf) {
  const accs = I.pension_accounts, age0 = I.age, retAge = I.retirement_age || 67;
  if (!accs || age0 == null) return I.pension_capital_at_retirement_today_eur || 0;
  const years = Math.max(0, retAge - age0), paying = Math.max(0, Math.min(years, (stop ?? retAge) - age0));
  let total = 0;
  for (const a of accs) {
    const r = a.return, g = (1 + r) ** paying;
    let fv = a.value * g + (r ? a.premium * (g - 1) / r : a.premium * paying);
    fv *= (1 + r) ** (years - paying);
    if (a.expected && paying >= years - 0.05) fv = a.expected;
    total += fv / (1 + inf) ** years * (1 - a.tax);
  }
  return total;
}
function planProject(I, sc) {
  const ret = sc.ret ?? I.return, inf = sc.inf ?? I.inflation, wr = sc.wr ?? I.withdrawal_rate;
  const real = (1 + ret) / (1 + inf) - 1;
  const company = I.include_company ? ((I.cash_company || 0) + (I.investments_company || 0)) * (1 - (I.company_extraction_tax || 0.15)) : 0;
  let capital = (I.cash_personal || 0) + (I.investments_personal || 0) + company;
  let loans = (I.loans || []).filter(x => x.instalment_monthly);
  const spc = sc.spend || 0, payoff = !!sc.payoff;
  const instalNow = loans.reduce((a, x) => a + x.instalment_monthly * 12, 0);
  if (payoff) { capital -= loans.reduce((a, x) => a + (x.outstanding || 0), 0); }
  let baseSpend = (I.annual_spending || 0) * (1 + spc);
  if (payoff) baseSpend -= instalNow * (1 + spc);
  let saving = (I.monthly_saving || 0) * 12 + (sc.extra || 0) * 12 - (I.annual_spending || 0) * spc;
  if (payoff) { saving += instalNow; loans = []; }
  const age0 = I.age, retAge = I.retirement_age || 67, endAge = I.live_until || 90;
  const n = age0 != null ? Math.floor(endAge - age0) + 1 : 40;
  const pensionY = (I.legal_pension_monthly || 0) * 12;
  let stop = sc.stop !== undefined ? sc.stop : (I.stop_work_age ?? null);
  if (stop != null && stop >= retAge) stop = null;
  const pcap = planPensionCapital(I, stop, inf);
  const year0 = +I.today.slice(0, 4);
  const rows = []; let fi = null, depleted = null;
  for (let i = 0; i <= n; i++) {
    const y = year0 + i, age = age0 != null ? age0 + i : null;
    const ended = loans.filter(x => x.ends && +x.ends.slice(0, 4) < y);
    const spend = baseSpend - ended.reduce((a, x) => a + x.instalment_monthly * 12 * (1 + spc), 0);
    const retired = age != null && age >= retAge;
    const working = !retired && (stop == null || age == null || age < stop);
    const need = Math.max(0, spend - (retired ? pensionY : 0));
    if (fi == null && capital > 0 && capital * wr >= need) fi = {year: y, age};
    rows.push({year: y, age, capital, spending: spend, target: need / wr});
    if (i === n) break;
    const freed = ended.reduce((a, x) => a + x.instalment_monthly * 12, 0);  // a paid-off loan's instalment is saved
    let flow = working ? saving + freed : -spend;
    if (retired) flow = pensionY - spend;
    capital = capital * (1 + real) + flow;
    if (retired && Math.abs(age - retAge) < 1 && pcap) capital += pcap;
    if (capital < 0 && depleted == null) depleted = {year: y + 1, age: age != null ? age + 1 : null};
  }
  const atRet = rows.find(r => r.age != null && r.age >= retAge);
  return {rows, fi, depleted, atRet: atRet ? atRet.capital : null, real};
}


// Pay off early or invest: the same calculation as centen/prepay.py (keep both in step).
function ppAnnuity(b, r, n) { return n <= 0 ? b : (r === 0 ? b / n : b * r / (1 - (1 + r) ** -n)); }
function ppPayments(b, r, inst, n) {
  const out = [];
  for (let k = 0; k < n; k++) {
    if (b <= 0.005) { out.push(0); continue; }
    b = b * (1 + r);
    const pay = k < n - 1 ? Math.min(inst, b) : b;
    b -= pay; out.push(pay);
  }
  return out;
}
const ppAfterTax = (v, paid, tax) => paid + Math.max(0, v - paid) * (1 - tax);
function ppFvDiff(p0, p1, rm, tax) {
  const n = p0.length; let fv = 0, paid = 0;
  for (let k = 0; k < n; k++) { const d = p0[k] - p1[k]; fv += d * (1 + rm) ** (n - 1 - k); paid += d; }
  return paid > 0 ? ppAfterTax(fv, paid, tax) : fv;
}
function ppCalc(L, amount, ret, tax, feeMonths) {
  const b = L.outstanding, r = L.monthly_rate, inst = L.instalment, n = L.payments_left;
  const x = Math.min(amount, b * (1 + feeMonths * r)), paid = x / (1 + feeMonths * r), b2 = Math.max(0, b - paid);
  const keep = ppPayments(b, r, inst, n), short = ppPayments(b2, r, inst, n);
  const instLow = b2 > 0 ? ppAnnuity(b2, r, n) : 0, low = ppPayments(b2, r, instLow, n);
  const sum = a => a.reduce((s, v) => s + v, 0);
  const fv = (q, which) => { const m = (1 + q) ** (1 / 12) - 1;
    return [ppAfterTax(x * (1 + m) ** n, x, tax), ppFvDiff(keep, which === "short" ? short : low, m, tax)]; };
  const be = which => { const g = q => { const [a, c] = fv(q, which); return c - a; };
    let lo = 0, hi = 0.25; if (g(lo) < 0) return 0; if (g(hi) > 0) return null;
    for (let i = 0; i < 60; i++) { const mid = (lo + hi) / 2; if (g(mid) > 0) lo = mid; else hi = mid; } return (lo + hi) / 2; };
  const [inv, sFv] = fv(ret, "short"), [, lFv] = fv(ret, "low");
  return {amount: x, fee: x - paid, invest: inv,
    shorter: {months_left: short.filter(v => v > 0.005).length, saved: sum(keep) - x - sum(short), fv: sFv, adv: sFv - inv, be: be("short")},
    lower: {instalment: instLow, drop: inst - instLow, saved: sum(keep) - x - sum(low), fv: lFv, adv: lFv - inv, be: be("low")}};
}
function prepayCard(v) {
  const PP = D.prepay;
  if (!PP || PP.error || !PP.loans.length) return;
  const sel = el("select", {"aria-label": "lening"}, PP.loans.map((l, i) => el("option", {value: i}, `${l.name} (${pct(l.annual_rate)})`)));
  const amtIn = el("input", {type: "number", min: 0, step: 1000, value: 20000, "aria-label": "bedrag", style: "width:120px"});
  const ret = el("input", {type: "range", min: 0, max: 10, step: 0.5, value: 5, "aria-label": "rendement"});
  const retB = el("b", {}, "5 %");
  const out = el("div");
  const c = card("Extra aflossen of beleggen?", "Wat heb je op de oorspronkelijke einddatum van de lening: los nu af en beleg wat je daarna niet meer betaalt, of beleg het bedrag meteen");
  c.body.append(el("div", {class: "ctrl"}, el("label", {}, el("span", {}, "Lening"), sel), el("label", {}, el("span", {}, "Bedrag nu"), amtIn),
    el("label", {}, el("span", {}, "Rendement bij beleggen ", retB), ret)), out);
  const draw = () => {
    const L = PP.loans[+sel.value], q = +ret.value / 100;
    retB.textContent = num1.format(+ret.value) + " %";
    const r = ppCalc(L, Math.max(0, +amtIn.value || 0), q, 0.10, PP.fee_months);
    const endShort = (() => { const d = new Date(S_TODAY()); d.setMonth(d.getMonth() + r.shorter.months_left); return d.toISOString().slice(0, 10); })();
    out.textContent = "";
    out.append(el("div", {class: "grid g4", style: "margin-top:12px"},
      tile("Korter lopen", `${r.shorter.adv >= 0 ? "+" : "−"}${eur(Math.abs(r.shorter.adv))}`, `t.o.v. beleggen · lening klaar rond ${dLabel(endShort)} · ${eur(r.shorter.saved)} interest bespaard`),
      tile("Lagere aflossing", `${r.lower.adv >= 0 ? "+" : "−"}${eur(Math.abs(r.lower.adv))}`, `t.o.v. beleggen · nieuwe aflossing ${eur(r.lower.instalment)} (−${eur(r.lower.drop)})`),
      tile("Beleggen", eur(r.invest), `op ${dLabel(L.maturity_date)}, na 10 % meerwaardebelasting op de winst`),
      tile("Omslagpunt", r.shorter.be == null ? "—" : pct(r.shorter.be), "boven dit rendement wint beleggen")));
    out.append(el("div", {class: "note", style: "margin-top:8px"}, `Wederbeleggingsvergoeding ${eur(r.fee)} (3 maanden interest) zit erin. Niet meegerekend: een belastingvoordeel op de lening (woonbonus of langetermijnsparen bij leningen van vóór 2020) en het risico van beleggen.`));
  };
  for (const e of [sel, amtIn, ret]) e.addEventListener("input", draw);
  c.root.style.marginTop = "14px";
  v.append(c.root);
  draw();
}
const S_TODAY = () => D.meta.today;

function viewPlanner(v) {
  const PL = D.planner;
  if (sectionError(v, PL, "Planner")) return;
  const I = PL.inputs, S = state.plan;
  const ctrl = el("div", {class: "ctrl"});
  const out = el("div");
  const slider = (key, label, min, max, step, def, fmt) => {
    const val = S[key] ?? def;
    const b = el("b", {}, fmt(val));
    const inp = el("input", {type: "range", min, max, step, value: val, "aria-label": label});
    inp.addEventListener("input", () => { S[key] = +inp.value; b.textContent = fmt(+inp.value); draw(); });
    ctrl.append(el("label", {}, el("span", {}, label + " ", b), inp));
  };
  const pctF = x => num1.format(x) + " %";
  slider("extra", "Extra sparen per maand", 0, 4000, 100, 0, x => eur(x));
  slider("spend", "Uitgaven t.o.v. nu", -40, 40, 5, 0, x => (x > 0 ? "+" : "") + x + " %");
  slider("ret", "Rendement per jaar", 0, 10, 0.5, +(I.return * 100).toFixed(1), pctF);
  slider("inf", "Inflatie per jaar", 0, 5, 0.5, +(I.inflation * 100).toFixed(1), pctF);
  slider("wr", "Opname per jaar (van je vermogen)", 2, 6, 0.25, +(I.withdrawal_rate * 100).toFixed(2), pctF);
  if (I.age != null) slider("stop", "Stoppen met werken (en sparen) op", Math.ceil(I.age), I.retirement_age, 1, Math.min(I.stop_work_age ?? I.retirement_age, I.retirement_age), x => x >= I.retirement_age ? "pensioenleeftijd" : x + " jaar");
  if ((I.loans || []).length) {
    const cb = el("input", {type: "checkbox"}); cb.checked = !!S.payoff;
    cb.addEventListener("change", () => { S.payoff = cb.checked; draw(); });
    ctrl.append(el("label", {class: "chk"}, cb, el("span", {}, "Leningen nu aflossen met je vermogen")));
  }
  const reset = el("button", {class: "toggle", type: "button", onclick: () => { state.plan = {}; render(); }}, "Terug naar je cijfers");
  const cc = card("Wat als…", "Verschuif de schuifjes; de berekening gebeurt hier in je browser");
  cc.body.append(ctrl, el("div", {style: "margin-top:10px"}, reset));
  v.append(cc.root, out);
  function draw() {
    out.textContent = "";
    const sc = {extra: S.extra || 0, spend: (S.spend || 0) / 100, ret: S.ret != null ? S.ret / 100 : undefined, inf: S.inf != null ? S.inf / 100 : undefined,
      wr: S.wr != null ? S.wr / 100 : undefined, stop: S.stop != null ? (S.stop < I.retirement_age ? S.stop : null) : undefined, payoff: S.payoff};
    const r = planProject(I, sc);
    out.append(el("div", {class: "grid g4", style: "margin-top:14px"},
      el("div", {class: "card tile hero span2"}, el("div", {class: "lbl"}, "Financieel onafhankelijk"),
        el("div", {class: "val"}, r.fi ? (r.fi.age != null ? `op ${Math.floor(r.fi.age)} jaar` : String(r.fi.year)) : "niet binnen de periode"),
        el("div", {class: "sub"}, r.fi ? `in ${r.fi.year}: je vermogen × ${pct(sc.wr ?? I.withdrawal_rate)} dekt dan je uitgaven` + (r.fi.age != null && r.fi.age >= I.retirement_age ? " (met je wettelijk pensioen)" : "") : "verhoog het sparen of verlaag de uitgaven")),
      tile("Vermogen bij pensioen", eur(r.atRet), `euro van vandaag · reëel rendement ${pct(r.real)}`),
      tile(r.depleted ? "Vermogen op" : `Vermogen op ${I.live_until} jaar`, r.depleted ? (r.depleted.age != null ? `op ${Math.floor(r.depleted.age)} jaar` : String(r.depleted.year)) : eur(r.rows[r.rows.length - 1].capital),
        r.depleted ? "het geld raakt op vóór het einde" : "euro van vandaag"),
    ));
    const c = card("Vermogen per jaar", "Euro van vandaag; oranje = vermogen dat je uitgaven van dat jaar draagt (na je pensioen: min je wettelijk pensioen)", {table: () => table([
      {label: "Jaar", get: x => String(x.year)}, {label: "Leeftijd", num: true, get: x => x.age != null ? String(Math.floor(x.age)) : "—"},
      {label: "Vermogen", num: true, get: x => eur(x.capital)}, {label: "Uitgaven", num: true, get: x => eur(x.spending)}], r.rows)});
    c.root.style.marginTop = "14px";
    out.append(c.root);
    requestAnimationFrame(() => lineChart(c.body, {labels: r.rows.map(x => String(x.year)), fmtX: (y, long) => {
        const row = r.rows.find(x => String(x.year) === y); return long && row && row.age != null ? `${y} · ${Math.floor(row.age)} jaar` : y; },
      series: [{name: "Vermogen", values: r.rows.map(x => Math.round(x.capital)), color: SERIES[0]},
               {name: "Nodig om van te leven", values: r.rows.map(x => Math.round(x.target)), color: SERIES[1]}], height: 280}));
  }
  draw();
  const g = el("div", {class: "grid g2", style: "margin-top:14px;align-items:start"});
  const cs = card("Scenario's", "Elk scenario verandert één ding t.o.v. je cijfers nu");
  cs.body.append(table([{label: "Scenario", get: r => r.name}, {label: "Onafhankelijk", num: true, get: r => r.fi_age != null ? `${Math.floor(r.fi_age)} jaar (${r.fi_year})` : (r.fi_year || "—")},
    {label: "Bij pensioen", num: true, get: r => eur(r.capital_at_retirement)}, {label: "Op het einde", num: true, get: r => r.depleted ? "op " + (r.depleted.age != null ? Math.floor(r.depleted.age) + " jaar" : r.depleted.year) : eur(r.end_capital)}], PL.scenarios));
  g.append(cs.root);
  g.append(notesCard("Vertrekpunt (uit je gegevens)", [
    `Leeftijd ${I.age != null ? Math.floor(I.age) : "onbekend (geboortedatum in het pensioenprofiel)"} · ${I.stop_work_age < I.retirement_age ? "stoppen met werken op " + I.stop_work_age + " · " : ""}pensioen op ${I.retirement_age} · wettelijk pensioen ${I.legal_pension_monthly != null ? eur(I.legal_pension_monthly) + " / maand" : "niet ingevuld"}.`,
    `Cash privé ${eur(I.cash_personal)}, beleggingen privé ${eur(I.investments_personal)}` + (I.include_company ? `, BV ${eur((I.cash_company || 0) + (I.investments_company || 0))}` + (I.company_tax_owed ? ` na ${eur(I.company_tax_owed)} nog te betalen btw en VenB` : "") + ` (niet vrij: telt pas na ${pct(I.company_extraction_tax)} roerende voorheffing bij uitkeren)` : "") + ".",
    `Pensioenkapitaal 2e/3e pijler nu ${eur(I.pension_capital_now)}; vanaf je pensioen na belasting, met premies zolang je werkt (de schuif ‘stoppen’ telt mee).`,
    "Sparen en extra sparen lopen enkel zolang je werkt; daarna leef je van je vermogen tot je pensioen.",
    `Sparen ${eur(I.monthly_saving)} per maand (inkomen − uitgaven, privé + BV, laatste 12 maanden) · uitgaven ${eur(I.annual_spending)} per jaar.`,
    (I.loans || []).length ? `Leningen: ${I.loans.map(l => `${l.name} ${eur(l.instalment_monthly)}/maand tot ${dLabel(l.ends)}`).join("; ")} (de uitgaven dalen als ze aflopen).` : "Geen leningen met een aflossingsplan.",
    PL.disclaimer]));
  v.append(g);
  prepayCard(v);
}

const VIEWS = {possessions: viewPossessions, fixed: viewFixed, forecast: viewForecast, pension: viewPension, planner: viewPlanner, tax: viewTax, total: viewTotal, personal: viewPersonal, business: viewBusiness, household: viewHousehold, invest: viewInvest, accounts: viewAccounts};
function render() {
  hideTip();
  renderTabs(); renderFilters();
  const v = document.getElementById("view"); v.textContent = "";
  VIEWS[state.tab](v);
}
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });
render();
</script>
